<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="Shortcut Icon" href="LOGO.png" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Room</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <br><br><br><br><br><br><br><br><br><br><br>
        <h1>Chat Room</h1>
        <br><br><br><br><br><br><br><br><br><br><br>
    </header>
    <main>
        <section id="login" class="bg-dark">
            <form id="messageForm">
                <label for="message">Message:</label>
                <br>
                <textarea id="message" name="message" required></textarea>
                <br>
                <button type="submit">Send</button>
            </form>
            <div id="messages"></div>
            <br>
            <a href="index.html">Back to home</a>
        </section>
    </main>

    <script>
        document.getElementById('messageForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const message = document.getElementById('message').value;
            fetch('chat.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `message=${encodeURIComponent(message)}`,
            })
            .then(response => response.text())
            .then(data => {
                console.log(data);
                loadMessages();
                document.getElementById('messageForm').reset();
            })
            .catch(error => console.error('Error:', error));
        });

        function loadMessages() {
            fetch('chat.php')
                .then(response => response.json())
                .then(data => {
                    const messagesDiv = document.getElementById('messages');
                    messagesDiv.innerHTML = '';
                    data.forEach(msg => {
                        const messageElement = document.createElement('div');
                        messageElement.classList.add('message');

                        const usernameElement = document.createElement('div');
                        usernameElement.classList.add('username');
                        usernameElement.textContent = msg.username;

                        const messageContentElement = document.createElement('div');
                        messageContentElement.classList.add('message-content');
                        messageContentElement.textContent = msg.message;

                        const timestampElement = document.createElement('div');
                        timestampElement.classList.add('timestamp');
                        timestampElement.textContent = msg.timestamp;

                        messageElement.appendChild(usernameElement);
                        messageElement.appendChild(messageContentElement);
                        messageElement.appendChild(timestampElement);
                        messagesDiv.appendChild(messageElement);
                    });
                })
                .catch(error => console.error('Error:', error));
        }

        loadMessages();
        setInterval(loadMessages, 5000); // 每5秒刷新一次消息
    </script>

    <footer>
        <p>&copy; DX_Pro 2025 | v2.00</p>
    </footer>
    
</body>
</html>
